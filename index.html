<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Dynamic Island — Now on the Web</title>
<meta name="description" content="An iPhone-style Dynamic Island in pure HTML, CSS and vanilla JavaScript — self-playing hero demo.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 32'%3E%3Crect width='64' height='32' rx='16' fill='%23000'/%3E%3Ccircle cx='32' cy='16' r='6' fill='%230a84ff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="bg" aria-hidden="true">
  <i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i>
</div>

<main class="stage">

  <!-- ============ THE DYNAMIC ISLAND (hero) ============ -->
  <div class="hero-outer" aria-label="Dynamic Island demo">
    <div class="eyebrow"><i class="live" aria-hidden="true"></i> Dynamic Island — web edition</div>
    <div class="floor" aria-hidden="true"></div>
    <div class="hero">
      <div class="island" id="island" role="button" tabindex="0" aria-expanded="false" aria-label="Dynamic Island">
        <div class="view view--compact" id="viewCompact"></div>
        <div class="view view--expand" id="viewExpand"></div>
      </div>
    </div>
  </div>

  <!-- notification banners (shown beneath the island) -->
  <div class="banners" id="banners" aria-live="polite"></div>

  <!-- hint / state caption -->
  <p class="stage-note" id="stageNote">tap the pill · or watch it play</p>

</main>

<script src="island.js"></script>
</body>
</html>
