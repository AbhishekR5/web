<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Dynamic Island</title>
<meta name="description" content="An iPhone-style Dynamic Island in pure HTML, CSS and vanilla JavaScript.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 32'%3E%3Crect width='64' height='32' rx='16' fill='%23000'/%3E%3Ccircle cx='32' cy='16' r='6' fill='%230a84ff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="bg" aria-hidden="true"></div>

<main class="stage">

  <!-- ================= PHONE ================= -->
  <section class="phone-zone" aria-label="iPhone mock-up">
    <div class="phone-scale">
      <div class="phone">
        <span class="btn-side btn-side--a" aria-hidden="true"></span>
        <span class="btn-side btn-side--b" aria-hidden="true"></span>
        <span class="btn-side btn-side--c" aria-hidden="true"></span>

        <div class="screen" id="screen">
          <div class="wallpaper" id="wallpaper" aria-hidden="true"></div>

          <!-- status: time + icons -->
          <div class="status-time" id="statusTime" aria-hidden="true">9:41</div>
          <div class="status-right" aria-hidden="true">
            <svg class="sig" viewBox="0 0 18 12" width="16" height="11">
              <rect x="0"  y="7.4" width="3" height="4.6" rx="1"/>
              <rect x="5"  y="4.9" width="3" height="7.1" rx="1"/>
              <rect x="10" y="2.4" width="3" height="9.6" rx="1"/>
              <rect x="15" y="0"  width="3" height="12" rx="1"/>
            </svg>
            <svg class="wifi" id="wifiIco" viewBox="0 0 18 13" width="17" height="12">
              <g class="wifi-arcs">
                <path d="M1.6 4.9c4.1-3.9 10.7-3.9 14.8 0"/>
                <path d="M4.6 8c2.5-2.3 6.3-2.3 8.8 0"/>
                <circle cx="9" cy="11" r="1.5"/>
              </g>
              <path class="wifi-slash" d="M1.5 12.2 16.5 1"/>
            </svg>
            <span class="battery" title="Battery">
              <span class="battery-body"><span class="battery-fill"></span></span>
              <span class="battery-cap"></span>
            </span>
          </div>

          <!-- privacy indicators -->
          <div class="indicators" aria-hidden="true">
            <span class="indicator" id="indMic" hidden>
              <i class="ind-dot ind-dot--mic"></i>
              <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="3" width="6" height="10" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0"/><path d="M12 18v3"/></svg>
            </span>
            <span class="indicator" id="indCam" hidden>
              <i class="ind-dot ind-dot--cam"></i>
              <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2.5" y="6.5" width="12.5" height="11" rx="2.6"/><path d="m15 11 4.4-2.6a.9.9 0 0 1 1.4.8v5.6a.9.9 0 0 1-1.4.8L15 13"/><circle cx="8.6" cy="12" r="2.4"/></svg>
            </span>
          </div>

          <!-- THE DYNAMIC ISLAND -->
          <div class="island" id="island" role="button" tabindex="0" aria-expanded="false" aria-label="Dynamic Island">
            <div class="view view--compact" id="viewCompact"></div>
            <div class="view view--expand" id="viewExpand"></div>
          </div>

          <!-- notification banners -->
          <div class="banners" id="banners" aria-live="polite"></div>
        </div><!-- /screen -->
      </div><!-- /phone -->
    </div>
  </section>

  <!-- ================= MINIMAL CONTROLS ================= -->
  <div class="ctrl dock" id="dock" aria-label="Controls">
    <button class="sim" data-trigger="music" aria-pressed="false" aria-label="Music"><span class="sim-ico" aria-hidden="true">🎵</span><span class="sim-live" aria-hidden="true"></span></button>
    <button class="sim" data-trigger="call" aria-pressed="false" aria-label="Call"><span class="sim-ico" aria-hidden="true">📞</span><span class="sim-live" aria-hidden="true"></span></button>
    <button class="sim" data-trigger="ride" aria-pressed="false" aria-label="Ride"><span class="sim-ico" aria-hidden="true">🚗</span><span class="sim-live" aria-hidden="true"></span></button>
    <button class="sim" data-trigger="msg" aria-pressed="false" aria-label="Notify"><span class="sim-ico" aria-hidden="true">💬</span><span class="sim-live" aria-hidden="true"></span></button>
    <span class="divider" aria-hidden="true"></span>
    <span class="sim-timer-chips" role="group" aria-label="Timer duration">
      <button data-sec="15"  aria-label="15 second timer">0:15</button>
      <button data-sec="60"  aria-label="1 minute timer" class="on">1:00</button>
      <button data-sec="300" aria-label="5 minute timer">5:00</button>
    </span>
  </div>

  <p class="stage-note" id="stageNote">Tap an icon — watch the pill.</p>
</main>

<script src="island.js"></script>
</body>
</html>
