<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Connect with us</title>
<meta name="description" content="Connect with us — Instagram, Facebook, WhatsApp, LinkedIn. Visit the website or send an email.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 32'%3E%3Crect width='64' height='32' rx='16' fill='%23000'/%3E%3Ccircle cx='32' cy='16' r='6' fill='%2330d158'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="bg" aria-hidden="true">
  <i class="mist m1"></i><i class="mist m2"></i><i class="mist m3"></i>
</div>

<main class="stage">

  <!--
    ONE scroll runway (the hero). While the user reads, the sticky
    pinner holds the capsule in view and the whole frame is scrubbed
    from its centered hero pose to a compact top-right Dynamic Island.
  -->
  <div class="hero" id="hero">

    <div class="pinner" id="pinner">

      <!-- ================= the one and only capsule ================= -->
      <div class="frame" id="frame">

        <!-- glass fill that appears when the capsule turns compact -->
        <div class="dglass" aria-hidden="true"></div>

        <!-- giant emerald rim -->
        <div class="capsule" aria-hidden="true"></div>

        <!-- thin glow bars near the top & bottom inner edges -->
        <i class="edge-bar edge-bar--top" aria-hidden="true"></i>
        <i class="edge-bar edge-bar--bottom" aria-hidden="true"></i>

        <!-- specular glints on the rim -->
        <i class="glint g1" aria-hidden="true"></i>
        <i class="glint g2" aria-hidden="true"></i>
        <i class="glint g3" aria-hidden="true"></i>
        <i class="glint g4" aria-hidden="true"></i>
        <i class="glint g5" aria-hidden="true"></i>

        <!-- ============ hero scene (content inside the capsule) ============ -->
        <div class="scene">

          <p class="title">Connect with&nbsp;us</p>

          <div class="island" id="island" aria-hidden="true"></div>

          <div class="tiles">
            <button class="tile" data-app="Instagram" aria-pressed="false">
              <span class="t-ico">
                <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5.2"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1.2" fill="currentColor" stroke="none"/></svg>
              </span>
              <span class="t-txt">Instagram</span>
            </button>
            <button class="tile" data-app="Facebook" aria-pressed="false">
              <span class="t-ico">
                <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="M13.4 21v-7.1h2.4l.36-2.8H13.4V9.4c0-.81.22-1.36 1.38-1.36h1.48V5.55c-.26-.03-1.13-.11-2.15-.11-2.13 0-3.59 1.3-3.59 3.69v2.06H8.5v2.8h2.02V21h2.88z"/></svg>
              </span>
              <span class="t-txt">Facebook</span>
            </button>
            <button class="tile" data-app="WhatsApp" aria-pressed="false">
              <span class="t-ico">
                <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="M12 2.6A9.3 9.3 0 0 0 3.1 16L2 21.7l5.8-1.1A9.3 9.3 0 1 0 12 2.6zm0 17a7.6 7.6 0 0 1-3.9-1.06l-.28-.17-3.43.65.68-3.34-.18-.29A7.65 7.65 0 1 1 12 19.6zm4.2-5.7c-.23-.12-1.36-.67-1.57-.75-.21-.08-.37-.12-.52.12-.15.24-.6.75-.73.9-.13.15-.27.17-.5.06-.23-.12-.97-.36-1.85-1.14a6.9 6.9 0 0 1-1.28-1.6c-.13-.23-.01-.36.1-.48.1-.1.23-.27.34-.4.11-.14.15-.23.23-.39.07-.15.04-.29-.02-.4-.06-.12-.52-1.26-.71-1.72-.19-.46-.38-.4-.52-.4h-.45c-.15 0-.4.06-.62.29-.21.23-.81.79-.81 1.93s.83 2.24.95 2.4c.12.15 1.64 2.5 3.97 3.51.55.24.99.38 1.33.48.56.18 1.07.16 1.47.1.45-.07 1.36-.56 1.55-1.1.19-.54.19-1 .13-1.1-.06-.1-.22-.16-.45-.28z"/></svg>
              </span>
              <span class="t-txt">WhatsApp</span>
            </button>
            <button class="tile" data-app="LinkedIn" aria-pressed="false">
              <span class="t-ico">
                <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="M6.94 8.9H3.9V20.3h3.04V8.9zM5.42 3.7a1.77 1.77 0 1 0 0 3.54 1.77 1.77 0 0 0 0-3.54zM20.1 13.7c0-3.06-1.63-4.48-3.8-4.48-1.76 0-2.55.97-2.98 1.65V8.9H10.3c.04.88 0 11.4 0 11.4h3.03v-6.37c0-.34.02-.68.12-.92.27-.68.89-1.38 1.93-1.38 1.36 0 1.9 1.04 1.9 2.56v6.11h3.03l-.01-6.6z"/></svg>
              </span>
              <span class="t-txt">LinkedIn</span>
            </button>
          </div>

          <div class="actions">
            <a class="pill-btn" href="https://abhishekr5.github.io/web/" target="_blank" rel="noopener">Visit Website</a>
            <a class="pill-btn" href="mailto:hello@abhishekr5.dev">Send Email</a>
          </div>

        </div><!-- /scene -->

        <!-- ============ compact docked UI (lives inside the same capsule) ============ -->
        <div class="dock" id="dock" aria-hidden="true">
          <p class="pop-head"><i class="cdot" aria-hidden="true"></i>Connect with&nbsp;us</p>
          <div class="pop-body" role="group" aria-label="Social channels">
            <button class="pop-row" data-app="Instagram">
              <span class="pop-ico" style="--c1:#e1306c;--c2:#833ab4" aria-hidden="true">&#128247;</span>Instagram
            </button>
            <button class="pop-row" data-app="Facebook">
              <span class="pop-ico" style="--c1:#1877f2;--c2:#0a4fc0" aria-hidden="true">&#128077;</span>Facebook
            </button>
            <button class="pop-row" data-app="WhatsApp">
              <span class="pop-ico" style="--c1:#25d366;--c2:#0b8a3c" aria-hidden="true">&#128172;</span>WhatsApp
            </button>
            <button class="pop-row" data-app="LinkedIn">
              <span class="pop-ico" style="--c1:#0a66c2;--c2:#004182" aria-hidden="true">&#128188;</span>LinkedIn
            </button>
          </div>
          <div class="pop-actions">
            <a class="pill-btn" href="https://abhishekr5.github.io/web/" target="_blank" rel="noopener">Visit Website</a>
            <a class="pill-btn" href="mailto:hello@abhishekr5.dev">Send Email</a>
          </div>
        </div><!-- /dock -->

      </div><!-- /frame -->

      <!-- hint at the bottom of the viewport, under the capsule -->
      <p class="stage-note" id="stageNote">tap a channel to say hello</p>

    </div><!-- /pinner -->
  </div><!-- /hero -->

</main>

<!-- notification toasts (fixed — usable in hero and docked states) -->
<div class="banners" id="banners" aria-live="polite"></div>

<script src="island.js"></script>
</body>
</html>
